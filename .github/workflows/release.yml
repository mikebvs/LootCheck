name: Release

# Builds the addon and uploads it to CurseForge when a version tag is pushed:
#
#     git tag -a v1.0.1 -m "1.0.1" && git push origin v1.0.1
#
# The tag should match the "## Version:" line in LootCheck.toc. The project id
# comes from "## X-Curse-Project-ID:" in the same file, so the only thing this
# workflow needs from you is the CF_API_TOKEN secret
# (Settings > Secrets and variables > Actions).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # so the packager can attach the zip to a GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The packager reads tags and history to work out the version and
          # to build the changelog, so a shallow clone is not enough
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # release.sh at the v2 tag reads CF_API_KEY and nothing else;
          # CF_API_TOKEN was added later, on master. Both names are set from
          # the one repository secret so this keeps working either way.
          # The log line "CurseForge ID: <id> [token set]" is the proof it was
          # picked up - without "[token set]" the upload is skipped silently
          # and the run still goes green.
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
